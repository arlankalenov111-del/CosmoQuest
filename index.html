<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B1533">
  <meta name="description" content="COSMOQUEST — интерактивная 2D космическая игра для детей: управляй марсианской базой, учись, играй и исследуй науку NASA.">
  <title>COSMOQUEST — Mission Survival</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="space-decor" aria-hidden="true"><div class="starfield s1"></div><div class="starfield s2"></div><div class="planet-bg"></div></div>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <button type="button" class="brand" data-nav="home" aria-label="COSMOQUEST Home"><span class="brand-symbol">✦</span><span>COSMO<span class="brand-tail">QUEST</span><small>MISSION SURVIVAL</small></span></button>
      <div class="sidebar-group"><span class="nav-title" data-i18n="nav.explore">ИССЛЕДОВАНИЕ</span><nav id="main-nav"></nav></div>
      <div class="sidebar-footer"><div class="robot-mini" aria-hidden="true">👾</div><div><strong id="nav-helper-name">MOKI</strong><small id="nav-tip">Твой помощник в космосе!</small></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-symbol">✦</span><strong>COSMOQUEST</strong></div>
        <div class="top-location" id="top-location">КОСМИЧЕСКИЙ ЦЕНТР</div>
        <div class="top-actions">
          <button class="language-toggle" id="lang-button" type="button" aria-label="Switch language">RU <span>↔</span> EN</button>
          <div class="top-stat" title="Cosmo Coins"><span class="stat-icon gold">✦</span><b id="top-coins">0</b></div>
          <div class="top-stat level-stat"><span class="stat-icon purple">★</span><b id="top-level">1</b></div>
          <button type="button" class="avatar-top" id="top-avatar" data-nav="avatar" aria-label="Monster profile">👾</button>
        </div>
      </header>
      <main class="main-stage" id="main" tabindex="-1"><noscript>Для игры нужно включить JavaScript. JavaScript is required to play.</noscript></main>
    </div>
  </div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile navigation"></nav>
  <div id="toast" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="modal" class="modal-root"></div>
</body>
</html>
