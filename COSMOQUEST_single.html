орону в зависимости от расстояния. Если в одну сторону 10 минут, ответ без времени обработки придёт через 20 минут.":"Жер мен Марстың арасындағы радиосигнал қашықтыққа байланысты бір бағытта шамамен 4–24 минут жүреді. Егер жауап бірден жіберілсе, жалпы уақыт екі есе артады.","4–24 минуты в одну сторону":"Бір бағытта 4–24 минут","Первый опубликованный отчёт MEDA с поверхности Марса описывал падение температуры примерно с −20 °C до −25,6 °C за 30 минут. Измерения относятся к конкретному месту и времени, а не к сегодняшней погоде.":"Марс бетінен жарияланған MEDA-ның алғашқы есебінде температураның 30 минут ішінде шамамен −20 °C-тан −25,6 °C-қа төмендегені сипатталған.","≈ −20 °C → −25,6 °C за 30 минут":"30 минутта ≈ −20 °C → −25,6 °C","Открытый набор OSD-37 (GLDS-37) сравнивает активность генов четырёх вариантов Arabidopsis thaliana, изученных в космическом полёте. Исследование не предсказывает урожайность на Марсе.":"OSD-37 (GLDS-37) ашық деректер жиыны ғарышқа ұшқан Arabidopsis thaliana өсімдігінің төрт экотипіндегі ген белсенділігін салыстырады.","DONKI содержит сведения о наблюдавшихся солнечных вспышках и выбросах корональной массы. Запись о таком событии сама по себе не означает опасную радиационную дозу на Марсе.":"DONKI-де Күн жарқылдары мен короналық масса шығарылымдары туралы дерек бар. Мұндай оқиға туралы жазба Марс бетіндегі радиация дозасын өздігінен көрсетпейді.","Каталог космической погоды":"Ғарыш ауа райының дерекқоры","Главная":"Басты бет","Управление базой":"Базаны басқару","Академия":"Академия","Мини-игры":"Шағын ойындар","Задания дня":"Күнделікті тапсырмалар","Астронавт":"Монстриктер","Магазин":"Дүкен","Достижения":"Жетістіктер","Наука NASA":"NASA ғылымы","Настройки":"Баптаулар","Первый запуск":"Алғашқы ұшу","Начни первую миссию":"Алғашқы миссияңды баста","Ученик космоса":"Ғарыш шәкірті","Заверши первый урок":"Алғашқы сабақты аяқта","Исследователь слов":"Сөз зерттеушісі","Изучи 10 терминов":"10 терминді үйрен","Инженер кислорода":"Оттегі инженері"," function wordLabel(w){return lang()==='kk'?w.kk:lang()==='ru'?w.ru:w.en;}
function wordDefinition(w){return lang()==='kk'?w.defkk:lang()==='ru'?w.defru:w.defen;}
function moduleWords(moduleIndex){return WORDS.filter(w=>w.module===moduleIndex);}
function moduleReady(moduleIndex){return moduleWords(moduleIndex).every(w=>state.lessons.includes(w.id));}
function wordStatusText(w){const r=state.words[w.id];return r?.correct>=3?say(B('Освоено','Mastered','Меңгерілді')):r?say(B('Изучается','Learning','Оқып жүр')):say(B('Новое понятие','New concept','Жаңа ұғым'));}
function wordModuleName(w){return MODULES[w.module]?say(MODULES[w.module].name):'';}
function wordContextSentence(w){const src=lessonSentence(w);return src?src.replace('____',wordLabel(w)):say(B('Это понятие используется в учебных заданиях.','This concept appears in the learning activities.','Бұл ұғым оқу тапсырмаларында кездеседі.'));}

function conceptOptions(w,limit=3){
 const pool=moduleWords(w.module).filter(x=>x.id!==w.id);
 const offset=(Number(w.id.slice(1))*3+1)%pool.length;
 const ids=[w,...Array.from({length:limit-1},(_,i)=>pool[(offset+i*2)%pool.length])];
 return ids.sort((a,b)=>a.id.localeCompare(b.id,'en',{numeric:true}));
}

function stopLessonClock(){if(ui.lessonClock){clearInterval(ui.lessonClock);ui.lessonClock=null;}}
function startLessonClock(){stopLessonClock();if(!ui.lessonMatchStart)ui.lessonMatchStart=Date.now();if(!state.settings.timers)return;ui.lessonClock=setInterval(()=>{if(ui.lessonPhase!=='matching'){stopLessonClock();return;}ui.lessonMatchElapsed=Math.max(0,Math.floor((Date.now()-ui.lessonMatchStart)/1000));const el=$('#lesson-match-time');if(el)el.textContent=`⏱ ${ui.lessonMatchElapsed} ${say(B('с','sec','сек'))}`;},1000);}
function lessonAnswerChoice(selected,review=false){const w=WORDS.find(x=>x.id===ui.lesson);if(!w)return;if(review){const item=ui.lessonErrors[0];if(!item||item.kind!=='choice')return;resolveLessonReview(selected===item.wordId);return;}if(ui.lessonPhase!=='choice')return;const correct=selected===w.id;if(!correct){ui.lessonErrors.push({kind:'choice',wordId:w.id});ui.lessonMistakes++;}ui.lessonAnswer=selected;ui.lessonFeedback={correct};ui.lessonPhase='choice-feedback';sound(correct?800:330,.12);render();}
function lessonCheckMatching(){if(ui.lessonPhase!=='matching')return;stopLessonClock();const w=WORDS.find(x=>x.id===ui.lesson);if(!w)return;ui.lessonMatchElapsed=ui.lessonMatchStart?Math.floor((Date.now()-ui.lessonMatchStart)/1000):0;const pairs=lessonPairs(w);const incorrect=pairs.filter(p=>ui.lessonMatchAnswers[p.id]!==p.id).map(p=>p.id);ui.lessonErrors.push(...incorrect.map(id=>({kind:'match',wordId:id})));ui.lessonMistakes+=incorrect.length;ui.lessonFeedback={incorrect};ui.lessonPhase='matching-feedback';sound(incorrect.length?330:800,.14);render();}
function lessonCheckGap(answer){const w=WORDS.find(x=>x.id===ui.lesson);if(!w)return;const review=ui.lessonPhase==='review'&&ui.lessonErrors[0]?.kind==='gap';if(!review&&ui.lessonPhase!=='gap')return;const right=normalize(wordLabel(w))===normalize(answer);if(review){resolveLessonReview(right);return;}if(!right){ui.lessonErrors.push({kind:'gap',wordId:w.id});ui.lessonMistakes++;}ui.lessonGapAnswer=answer;ui.lessonFeedback={correct:right};ui.lessonPhase='gap-feedback';sound(right?800:330,.12);render();}
function resolveLessonReview(ok){if(ui.lessonPhase!=='review'||!ui.lessonErrors.length)return;if(ok){ui.lessonErrors.shift();ui.lessonFeedback=null;sound(850,.12);}else{ui.lessonFeedback={correct:false};ui.lessonMistakes++;sound(330,.12);}render();}
function lessonReviewMatch(){const item=ui.lessonErrors[0];if(ui.lessonPhase!=='review'||item?.kind!=='match')return;resolveLessonReview($('#lesson-review-select')?.value===item.wordId);}
function scheduledDate(days){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function recordLessonLearning(id,mistakeCount=0){const hadMistakes=mistakeCount>0;const old=state.words[id],wasKnown=Boolean(old&&old.correct>0),streak=hadMistakes?0:Math.min(5,(old?.streak||0)+1),interval=hadMistakes?1:[1,3,7,14,30][Math.max(0,streak-1)];state.words[id]={correct:(old?.correct||0)+1,streak,mistakes:(old?.mistakes||0)+mistakeCount,intervalDays:interval,due:scheduledDate(interval),lastReviewed:today()};markDaily('words',id);if(!wasKnown){reward(2,5);}state.stats.correct++;save();checkAch();}
function lessonFinish(){const w=WORDS.find(x=>x.id===ui.lesson);if(!w||ui.lessonPhase!=='review'||ui.lessonErrors.length)return;if(!ui.lessonStudyRecorded){ui.lessonStudyRecorded=true;if(!state.lessons.includes(w.id)){state.lessons.push(w.id);state.stats.lessonCompleted++;reward(12,25);}recordLessonLearning(w.id,ui.lessonMistakes);}ui.lessonPhase='done';ui.lessonFeedback=null;sound(920,.18);toast(say(B('Урок завершён!','Lesson completed!','Сабақ аяқталды!')));render();}

let content='';if(g.type==='recall'){const q=recallQ();content=`<div class="game-counter"><span>${say(B('Вопрос','Question'))} ${g.index+1}/7</span><span class="chip gold">⭐ ${g.score}</span>${state.settings.timers?`<span class="chip" id="timer-label">⏳ ${g.time}s</span>`:''}</div>${state.settings.timers?`<div class="timer-track"><i id="timer-meter" style="width:${g.time/(state.settings.difficulty==='easy'?35:25)*100}%"></i></div>`:''}<div class="kicker">COSMIC RECALL · ${RECALL.length} ${say(B('тем','topics'))} · ${RECALL.reduce((n,q)=>n+q.a.reduce((m,g)=>m+g.length,0),0)} ${say(B('вариантов ответов','accepted answers'))}</div><h2>${say(q.q)}</h2><p class="muted" style="margin-top:12px">${say(B('Можно отвечать на русском, английском или казахском. Баллы отражают игровую сложность, а не статистику игроков.','You can answer in Russian, English or Kazakh. Scores reflect game-defined difficulty, not player statistics.'))}</p>${g.feedback?`<div class="game-feedback"><strong>${g.feedback.correct?say(B('Правильно!','Correct!')):say(B('Разберём ответ','Let’s learn'))}</strong><p>${g.feedback.correct?`+${g.feedback.points} ${say(B('баллов','points'))}. `:''}${state.settings.explanations||g.showExplain?say(q.why):btn('show-explanation',say(B('Показать объяснение','Show explanation')),'ghost btn-small')}</p><p class="micro">${say(B('Примеры правильных ответов:','Example correct answers:'))} ${q.a.slice(0,3).map(a=>esc(lang()==='ru'?a[0]:lang()==='kk'?(KK_ANSWERS[a[0]]?.[0]||a[2]||a[1]):a[1])).join(', ')}</p></div>${btn('recall-next',g.index===6?say(B('Завершить','Finish')):say(B('Следующий вопрос','Next question')),'primary')}`:`<form data-form="recall" class="grid" style="margin-top:20px"><input class="answer-field" id="recall-answer" name="answer" autocomplete="off" aria-label="Answer" placeholder="${say(B('Введи ответ…','Enter an answer…'))}" required>${btn('recall-submit',say(B('Ответить','Submit answer')),'primary')}</form>`}`;}
if(g.type==='relay'){const bot=g.players===1,participants=bot?[state.nick,'Moki']:Array.from({length:g.players},(_,i)=>`${say(B('Игрок','Player'))} ${i+1}`),cur=participants[g.turn%participants.length],isBot=bot&&g.turn%2===1;content=`<div class="game-counter"><span>💫 ${say(B('Передачи','Passes'))}: ${g.transfers}/8</span><span class="chip gold">⭐ ${g.score}</span>${state.settings.timers?`<span id="timer-label" class="chip">⏳ ${g.time}s</span>`:''}</div>${state.settings.timers?`<div class="timer-track"><i id="timer-meter" style="width:${g.time/(state.settings.difficulty==='easy'?90:75)*100}%"></i></div>`:''}<div class="center" style="font-size:84px;animation:float 2s infinite">${g.paused?'⏸️':'🔮'}</div><h3 class="center">${say(B('Ход','Turn'))}: ${esc(cur)} ${isBot?'🤖':''}</h3><p class="center muted">${say(relayQ().q)}</p>${g.paused?`<div class="notice">${say(B('Игра на паузе','Game paused'))}</div>`:g.feedback?`<div class="game-feedback"><p>${say(g.feedback.text)}</p></div>${btn('relay-next',say(B('Передать модуль →','Pass the module →')),'primary')}`:isBot?`<div class="notice center">${say(B('Моки — виртуальный монстрик. Его ответ запрограммирован.','Moki is a scripted virtual monster, not an online player.'))}</div>${btn('relay-bot',say(B('Моки передаёт модуль','Moki passes the module')),'cyan')}`:`<form data-form="relay" class="grid" style="margin-top:15px"><input class="answer-field" id="relay-answer" name="answer" autocomplete="off" aria-label="Answer" placeholder="${say(B('Введи ответ…','Enter your answer…'))}" required><button class="btn btn-primary" type="submit">${say(B('Проверить ответ','Check answer'))}</button></form>`}<div class="btn-row" style="margin-top:15px">${btn('relay-pause',g.paused?say(B('Продолжить','Resume')):say(B('Пауза','Pause')),'ghost')}</div>`;}
if(g.type==='power'){const used=Object.values(g.alloc).reduce((a,b)=>a+b,0);content=`<div class="kicker">ENGINEERING LAB</div><h2>${say(B('Распредели 100 единиц энергии','Allocate 100 energy units'))}</h2><p class="muted">${say(B('Минимумы: жизнеобеспечение 40, отопление 25, лаборатория 15. Найди баланс.','Minimums: Life Support 40, Heating 25, Science Lab 15. Find a balance.'))}</p>${[['life','❤️',B('Жизнеобеспечение','Life Support'),40],['heat','🌡️',B('Отопление','Heating'),25],['science','🔬',B('Лаборатория','Science Lab'),15]].map(([key,ic,name,min])=>`<div class="power-control"><label for="power-${key}">${ic} ${say(name)} <small>(${min}+)</small></label><input type="range" min="0" max="100" step="5" id="power-${key}" data-power="${key}" value="${g.alloc[key]}"><strong id="power-label-${key}">${g.alloc[key]}</strong></div>`).join('')}<div class="flex between" style="margin:19px 0"><span>${say(B('Использовано','Allocated'))}: <b id="power-used">${used}</b>/100</span><span class="chip" id="power-left">${say(B('Осталось','Remaining'))}: ${100-used}</span></div>${g.feedback?`<div class="game-feedback">${say(g.feedback.text)}</div>`:''}${btn('power-submit',say(B('Проверить распределение','Evaluate allocation')),'primary')}`;}
if(g.type==='water'||g.type==='fix'){const steps=g.type==='water'?WATER_STEPS:FIX_STEPS;const order=g.type==='water'?[2,0,3,1]:[2,0,3,1];content=`<div class="kicker">${g.type==='water'?'WATER RECOVERY':'ELECTRICAL SYSTEM'}</div><h2>${g.type==='water'?say(B('Собери цикл переработки воды','Assemble the water loop')):say(B('Восстанови цепь подачи энергии','Restore the power circuit'))}</h2><p class="muted">${say(B('Нажимай на элементы в правильном порядке. Также работает с клавиатуры — перетаскивать не нужно.','Select components in the correct order. Keyboard input works; drag-and-drop is not needed.'))}</p><div class="sortable-stage">${order.map(index=>{const s=steps[index];return `<button class="sort-chip ${g.sequence.includes(s[0])?'used':''}" data-action="sequence-pick" data-id="${s[0]}" ${g.sequence.includes(s[0])?'disabled':''}>${s[1]} ${say(s[2])}</button>`;}).join('')}</div><h4>${say(B('Твоя схема','Your sequence'))}</h4><div class="sortable-stage" style="align-items:center">${g.sequence.length?g.sequence.map((id,i)=>`<span class="sequence-step">${i+1}. ${say(steps.find(s=>s[0]===id)[2])}</span>`).join('<span>→</span>'):`<p class="muted">${say(B('Выбери первый элемент','Select the first component'))}</p>`}</div>${g.feedback?`<div class="game-feedback">${say(g.feedback.text)}</div>`:''}<div class="btn-row">${btn('sequence-reset',say(B('Очистить','Clear','Тазарту')),'outline',g.sequence.length?'':'disabled')}${btn('sequence-check',say(B('Проверить цепочку','Check sequence')),'primary',g.sequence.length!==4?'disabled':'')}</div>`;}
if(g.type==='sort'){content=`<h2>${say(B('Разложи оборудование по категориям','Sort the equipment'))}</h2><p class="muted">${say(B('Выбери назначение каждого прибора.','Choose the purpose of each piece of equipment.'))}</p><div class="grid grid-2" style="margin:20px 0">${SORT_ITEMS.map((it,i)=>`<div class="mission-tile"><div class="flex"><span style="font-size:34px">${it[0]}</span><strong>${say(it[1])}</strong></div><select data-sort="${i}" class="answer-field" style="padding:10px;margin-top:11px"><option value="">${say(B('Выбери категорию','Choose category'))}</option>${Object.entries(SORT_CATS).map(([key,name])=>`<option value="${key}" ${g.answers[i]===key?'selected':''}>${say(name)}</option>`).join('')}</select></div>`).join('')}</div>${g.feedback?`<div class="game-feedback">${say(g.feedback.text)}</div>`:''}${btn('sort-submit',say(B('Проверить категории','Check categories')),'primary')}`;}

function startRecallTicker(){if(ui.relayTick)return;setGameTimer(()=>{const g=ui.game;if(!g||g.type!=='recall'||g.stage!=='play'||g.feedback||ui.route!=='games'){stopGameTimer();return;}if(g.paused||g.feedback)return;g.time--;const label=$('#timer-label'),bar=$('#timer-meter');if(label)label.textContent=`⏳ ${g.time}s`;if(bar)bar.style.width=`${clamp(g.time/(state.settings.difficulty==='easy'?35:25)*100)}%`;if(g.time<=0){stopGameTimer();submitRecall('');}});}
function startRelayTicker(){if(ui.relayTick)return;setGameTimer(()=>{const g=ui.game;if(!g||g.type!=='relay'||g.stage!=='play'||ui.route!=='games'){stopGameTimer();return;}if(g.paused||g.feedback)return;g.time--;const label=$('#timer-label'),bar=$('#timer-meter');if(label)label.textContent=`⏳ ${g.time}s`;if(bar)bar.style.width=`${clamp(g.time/(state.settings.difficulty==='easy'?90:75)*100)}%`;if(g.time<=0){endGame(false,B('Энергомодуль безопасно отключился. Попробуй ещё раз!','The energy module shut down safely. Try again!'));}});}
function submitRecall(answer){const g=ui.game;if(!g||g.type!=='recall'||g.stage!=='play'||g.feedback)return;const q=recallQ(),matched=findAnswer(q,answer),idx=q.a.indexOf(matched),points=idx<0?0:idx>=3?30:idx>=2?20:10;g.score+=points;if(points){g.correct++;state.stats.correct++;save();checkAch();}g.feedback={correct:!!matched,points};g.showExplain=false;stopGameTimer();render();}
function recallNext(){const g=ui.game;if(!g||!g.feedback)return;g.feedback=null;g.showExplain=false;if(g.index===6){if(g.daily&&!state.daily.challengeDone){state.daily.challengeDone=true;state.daily.challengeScore=g.score;reward(35,45);save();}endGame(true,B(`Верных ответов: ${g.correct}/7.`,`Correct answers: ${g.correct}/7.`));return;}g.index++;g.time=state.settings.difficulty==='easy'?35:25;render();}
function submitRelay(answer){const g=ui.game;if(!g||g.type!=='relay'||g.stage!=='play'||g.paused||g.feedback)return;const q=relayQ(),matched=findAnswer(q,answer);if(matched){g.score+=10;g.correct++;state.stats.correct++;save();checkAch();g.feedback={text:B('Верно! Модуль готов к передаче.','Correct! The module is ready to pass.')};}else g.feedback={text:B('Пока не получилось. Пример ответа: '+q.a[0][0]+'. Попробуй снова или передай модуль.','Not quite. Example answer: '+q.a[0][1]+'. Try again or pass the module.')};render();}
function passRelay(bot=false){const g=ui.game;if(!g||g.type!=='relay'||g.stage!=='play')return;if(g.paused)return;if(g.feedback&&!bot&&g.feedback.text.en.startsWith('Not quite')){g.feedback=null;render();return;}g.feedback=null;g.transfers++;if(g.transfers>=8){endGame(true,B('Команда успешно сделала 8 передач!','Your crew completed 8 passes!'));return;}g.turn++;render();}
function endGame(success,message){const g=ui.game;if(!g||g.stage==='result')return;stopGameTimer();g.running=false;g.stage='result';g.success=success;g.message=message;if(success){state.stats.miniCompleted++;markDaily('games');if(!state.miniWins.includes(g.type)){state.miniWins.push(g.type);reward(25,35);}save();checkAch();}render();}
function checkPower(){const g=ui.game;if(!g)return;const a=g.alloc,used=Object.values(a).reduce((x,y)=>x+y,0);if(used<=100&&a.life>=40&&a.heat>=25&&a.science>=15){g.feedback={text:B('Отличный баланс: все системы получают достаточно энергии.','Well balanced: every system receives enough electricity.')};endGame(true,B('Ты нашёл рабочий энергетический бюджет.','You found a viable energy budget.'));}else{g.feedback={text:B(used>100?'Ты выделил больше 100 единиц. Уменьши расход.':'Не все системы достигли безопасных учебных минимумов.','Some systems lack their minimum allocation, or total use exceeds 100. Adjust the sliders.','Барлық жүйелер оқу үшін белгіленген ең аз мөлшерге жеткен жоқ. Энергияны қайта бөл.')};render();}}
function checkSequence(){const g=ui.game,steps=g.type==='water'?WATER_STEPS:FIX_STEPS;const ids=steps.map(s=>s[0]);if(g.sequence.join(',')===ids.join(',')){endGame(true,g.type==='water'?B('Система собрана! На МКС продемонстрировали восстановление до 98% собираемой воды; здесь показана упрощённая схема.','Loop complete! ISS systems have demonstrated recovery of up to 98% of collected water; this is a simplified diagram.'):B('Электрическая цепь восстановлена! Это учебное упрощение реальных электрических систем.','Power restored! This is a simplified model of actual electrical systems.'));}else{g.feedback={text:B('Последовательность пока неверна. Подумай о том, откуда начинается поток, и попробуй ещё раз.','The sequence is not correct yet. Think about where the flow begins and try again.')};render();}}
function checkSort(){const g=ui.game,wrong=SORT_ITEMS.filter((item,i)=>g.answers[i]!==item[2]).length;if(wrong===0){endGame(true,B('Все приборы распределены правильно!','Every item is in the correct category!'));}else{g.feedback={text:B(`Неправильных категорий: ${wrong}. Подумай о назначении каждого прибора.`,`Incorrect categories: ${wrong}. Think about each device’s purpose.`)};render();}}
function dailyTasks(){return[{key:'words',icon:'📖',name:B('Изучи или повтори 3 понятия','Learn or review 3 concepts','3 ұғымды үйрен немесе қайтала'),desc:B('Заверши уроки или повтори три разных понятия в Академии.','Complete lessons or review three different concepts in the Academy.','Академияда үш түрлі ұғымды үйрен немесе қайтала.'),need:3,reward:20,route:'academy'},{key:'games',icon:'🎮',name:B('Пройди мини-игру','Complete a mini-game'),desc:B('Успешно заверши одну мини-игру.','Successfully finish any mini-game.'),need:1,reward:30,route:'games'},{key:'decisions',icon:'🪐',name:B('Прими решение на базе','Make a base decision'),desc:B('Заверши один сол марсианской миссии.','Complete one sol of your Mars mission.'),need:1,reward:40,route:'mission'}];}
function renderDaily(){ensureDaily();return `<div class="section-head"><div><div class="kicker">DAILY MISSIONS</div><h2>${say(B('Твои миссии на сегодня','Your missions for today'))}</h2><p>${say(B('Три небольших задания каждый день. Без штрафов за пропуски.','Three small daily goals. No penalties for missing a day.'))}</p></div><span class="chip gold">🔥 ${state.daily.streak} ${say(B('дней','days'))}</span></div><div class="grid daily-grid">${dailyTasks().map(d=>{const n=Math.min(d.need,state.daily.progress[d.key]||0),claimed=state.daily.claimed.includes(d.key);return `<div class="card daily-card"><div style="font-size:39px">${d.icon}</div><h3>${say(d.name)}</h3><p class="muted">${say(d.desc)}</p><div class="flex between"><b>${n}/${d.need}</b><span class="reward">${money(d.reward)}</span></div><div class="progress" style="margin-bottom:16px"><i style="width:${n/d.need*100}%;background:var(--green)"></i></div>${claimed?`<div class="chip green">✓ ${say(B('Награда получена','Reward claimed'))}</div>`:n>=d.need?btn('daily-claim',say(B('Получить награду','Claim reward')),'primary',`data-key="${d.key}"`):btn('daily-go',say(B('Перейти к заданию','Go to activity','Тапсырмаға өту')),'outline',`data-key="${d.key}"`)}</div>`;}).join('')}</div><div class="card card-hl" style="margin-top:19px"><div class="flex between wrap"><div><div class="kicker">DAILY COSMIC CHALLENGE</div><h2>🧠 ${say(B('Интеллектуальное испытание','Daily Cosmic Challenge'))}</h2><p class="muted" style="margin-top:9px">${say(B('Семь вопросов, которые меняются по календарной дате. Одна награда в день.','Seven questions determined by your local calendar date. One reward per day.'))}</p><span class="chip gold">${money(35)} + 45 XP</span>${state.daily.challengeDone?` <span class="chip green">✓ ${state.daily.challengeScore} ${say(B('баллов','points'))}</span>`:''}</div>${btn('daily-challenge',state.daily.challengeDone?say(B('Играть без награды','Practice again')):say(B('Начать испытание','Start challenge')),'primary')}</div></div><div class="notice">${say(B('Ежедневная дата определяется по часам устройства. Без сервера нельзя полностью защититься от изменения времени.','Daily progress follows your device clock. Without a server, device time changes cannot be fully prevented.'))}</div>`;}
function isOwned(slot,value){return (FREE[slot]||[]).includes(value)||state.owned.includes(`${slot}-${value}`);}

tus?.status==='loading'?`<div class="notice">${say(B('Запрос к NASA…','Loading from NASA…'))}</div>`:''}${status?.status==='loaded'?`<div class="notice"><strong>${say(B('Ответ API получен','API response received'))}</strong> · ${esc(status.fetchedAt)} · ${status.events.length} ${say(B('записей','records'))}. ${say(B('Это записи реальных зарегистрированных событий, не показатели марсианской базы.','These are historical event records, not measurements of your game base.'))}</div><div class="grid grid-2">${status.events.slice(0,6).map(ev=>`<div class="mission-tile"><strong>☀️ ${esc(ev.id)}</strong><p class="micro">${esc(ev.when)}</p><span class="chip blue">HISTORICAL NASA RECORD</span></div>`).join('')}</div>${status.events.length===0?`<p class="muted">${say(B('В выбранном периоде записей не найдено. Это не означает отсутствие риска.','No entries were returned in the period. This does not prove zero risk.'))}</p>`:''}`:''}</div>`;}

кий контраст','High contrast'))}${cb('largeText',B('Крупный текст','Large text'))}<div class="notice">${say(B('Работает клавиатурная навигация, видимый фокус, Enter и пробел. Таймеры можно отключить. Режим уменьшения движения учитывает настройки устройства.','Keyboard navigation, visible focus, Enter and Space are supported. Timers can be disabled. Reduced-motion system preferences are respected.'))}</div></div><div class="card"><h3>💾 ${say(B('Прогресс','Progress'))}</h3><p class="muted">${say(B('Сохранение хранится в этом браузере. Ты можешь выгрузить JSON и перенести его на другое устройство.','Progress is stored in this browser. Export JSON to transfer it to another device.'))}</p><div class="btn-row">${btn('go-achievements',say(B('Просмотр прогресса','View progress')),'outline')}${btn('export-save',say(B('Экспорт JSON','Export save')),'cyan')}<label class="btn btn-outline file-btn">${say(B('Импорт JSON','Import save'))}<input id="import-file" type="file" accept=".json,application/json" aria-label="Import save"></label></div><hr>${btn('reset-ask',say(B('Сбросить весь прогресс','Reset all progress')),'danger')}</div></div>`;}
const SCIENCE_EXTRAS={
 moxie:{mechanism:B('MOXIE использовал электричество для превращения углекислого газа марсианской атмосферы в кислород. Это пример технологии использования местных ресурсов.','MOXIE used electricity to extract oxygen from carbon dioxide in the Martian atmosphere. It demonstrates using locally available resources.','MOXIE Марс атмосферасындағы көмірқышқыл газынан оттегі алу үшін электр қуатын пайдаланды. Бұл жергілікті ресурстарды қолдану технологиясының мысалы.'),task:B('В Mission Control производство кислорода улучшает запас воздуха, но уменьшает энергию.','In Mission Control, making oxygen replenishes the air supply but uses electricity.','Миссияны басқаруда оттегі өндіру ауа қорын толықтырады, бірақ энергияны жұмсайды.'),limit:B('Эксперимент не обеспечивал дыхание экипажа и не доказывает, что такая система уже работает на большой марсианской базе.','The experiment did not supply a crew with breathing oxygen and was not a full Mars-base life-support system.','Тәжірибе экипажды тыныс алуға қажет оттегімен қамтамасыз еткен жоқ және толыққанды Марс базасының жүйесі болған жоқ.'),route:'mission'},

 comm:{mechanism:B('Радиосигналы распространяются со скоростью света. Из-за огромного расстояния с Марсом нельзя разговаривать без задержки.','Radio signals travel at light speed; the great distance to Mars prevents instant conversations.','Радиосигналдар жарық жылдамдығымен тарайды. Марсқа дейінгі үлкен қашықтық салдарынан лезде сөйлесу мүмкін емес.'),task:B('Если сигнал идёт в одну сторону 10 минут, ответ без времени обработки поступит через 20 минут.','If a signal takes 10 minutes one way, a reply sent immediately arrives after 20 minutes total.','Сигнал бір бағытта 10 минут жүрсе, бірден жіберілген жауап 20 минуттан кейін келеді.'),limit:B('Время меняется по мере движения планет; игра не рассчитывает фактическую задержку для сегодняшнего положения Марса.','The delay changes with planetary positions. The game does not compute today’s actual signal delay.','Кідіріс ғаламшарлардың орнына байланысты өзгереді. Ойын бүгінгі нақты кідірісті есептемейді.'),route:'academy'},
 meda:{mechanism:B('MEDA на Perseverance измеряет параметры марсианской погоды: температуру, давление, ветер и пыль.','MEDA aboard Perseverance measures Martian conditions including temperature, pressure, wind and dust.','Perseverance марсоходындағы MEDA температураны, қысымды, желді және шаңды өлшейді.'),task:B('На третьем соле Mission Control пыль уменьшает поступление солнечного света к панелям.','On the third sol of Mission Control, dust reduces sunlight reaching solar panels.','Миссияның үшінші солында шаң күн панельдеріне түсетін жарықты азайтады.'),limit:B('Архивная погода в кратере Езеро не описывает условия на всей планете и не является прогнозом на сегодня.','An archival Jezero Crater record does not describe all of Mars or today’s forecast.','Езеро кратеріндегі мұрағаттық өлшем бүкіл Марстың ауа райын да, бүгінгі болжамды да білдірмейді.'),route:'mission'},
 osdr:{mechanism:B('Учёные сравнивают активность генов у разных экотипов растения, чтобы исследовать биологическую реакцию на космический полёт.','Researchers compare gene activity across plant ecotypes to study biological responses to spaceflight.','Ғалымдар ғарыштағы биологиялық әсерді түсіну үшін өсімдіктің әртүрлі экотиптеріндегі ген белсенділігін салыстырады.'),task:B('Обсуди, какие дополнительные эксперименты потребуются, прежде чем выращивать растения для экипажа на Марсе.','Consider what additional tests would be needed before using plants to feed a crew on Mars.','Марста экипажға азық өсіру үшін тағы қандай сынақтар керек екенін ойлан.'),limit:B('Генетические изменения во время полёта не дают прямого прогноза урожайности в марсианской оранжерее.','Spaceflight gene-expression results cannot directly predict yields inside a future Mars greenhouse.','Ғарыштағы ген белсенділігі нәтижелері болашақ Марс жылыжайының өнімін тікелей болжай алмайды.'),route:'academy'},

document.addEventListener('submit',event=>{const f=event.target.closest('form[data-form]');if(!f)return;event.preventDefault();const data=new FormData(f),answer=String(data.get('answer')||'').trim();if(!answer)return;if(f.dataset.form==='lesson-gap'){lessonCheckGap(answer);return;}if(f.dataset.form==='recall')submitRecall(answer);if(f.dataset.form==='relay')submitRelay(answer);});
document.addEventListener('input',event=>{const inp=event.target;if(inp.id==='vocab-search'){const result=$('#vocab-results');if(result)result.innerHTML=renderWordList(inp.value);}if(inp.dataset.power&&ui.game?.type==='power'){const key=inp.dataset.power;const other=Object.entries(ui.game.alloc).reduce((a,[k,v])=>a+(k===key?0:v),0);const value=Math.min(Number(inp.value),Math.max(0,100-other));ui.game.alloc[key]=value;inp.value=String(value);$('#power-label-'+key).textContent=String(value);const used=Object.values(ui.game.alloc).reduce((a,b)=>a+b,0);$('#power-used').textContent=used;const left=$('#power-left');left.textContent=`${say(B('Осталось','Remaining'))}: ${100-used}`;left.style.color=used>100?'#ff9cb9':'#b8edfa';}});
document.addEventListener('change',async event=>{const input=event.target;if(input.id==='relay-players'&&ui.game){ui.game.players=Number(input.value)||1;ui.gameConfig.relayPlayers=ui.game.players;return;}if(input.dataset.sort!==undefined&&ui.game){ui.game.answers[input.dataset.sort]=input.value;return;}if(input.dataset.lessonMatch!==undefined&&ui.lessonPhase==='matching'){ui.lessonMatchAnswers[input.dataset.lessonMatch]=input.value;return;}if(input.dataset.final!==undefined&&ui.finalModule!==null){ui.finalAnswers[input.dataset.final]=input.value;ui.finalOutcome=null;const resetBtn=document.querySelector('[data-action="final-reset"]');if(resetBtn)resetBtn.disabled=!Object.values(ui.finalAnswers).some(Boolean);return;}if(input.dataset.setting){const key=input.dataset.setting,oldLang=lang();state.settings[key]=input.type==='checkbox'?input.checked:input.value;save();if(key==='music')toggleMusic();if(key==='effects'&&input.checked)sound(650,.09);render();if(key==='language'&&oldLang!==lang())toast(say(B('Язык изменён','Language changed')));return;}if(input.id==='import-file'){const file=input.files?.[0];if(!file)return;try{if(file.size>250000)throw Error('File too large');const data=JSON.parse(await file.text()),imported=validateSave(data);state=imported;ensureDaily();save();stopLessonClock();stopGameTimer();ui.game=null;ui.lesson=null;closeModal();ui.route='home';render();toast(say(B('Сохранение загружено','Save imported')));}catch(e){toast(say(B('Ошибка импорта: неверный файл сохранения','Import error: invalid save file')));}return;}});
$('#lang-button').addEventListener('click',()=>{state.settings.language=({ru:'en',en:'kk',kk:'ru'})[lang()];save();render();sound(660,.09);});
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal'))closeModal();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&ui.modal){closeModal();return;}const scene=event.target.closest('[data-scene]');if(scene&&(event.key==='Enter'||event.key===' ')){event.preventDefault();setModal('scene',scene.dataset.scene);}});
if(savedCorrupt)setTimeout(()=>toast(say(B('Повреждённое сохранение: начата новая игра.','Save was corrupted: started a new game.'))),1000);
render();
})();

</script>
</body>
</html>
